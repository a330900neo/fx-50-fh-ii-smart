<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>用戶指南 ｜ CASIO fx-50FH II</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&family=Noto+Sans+TC:wght@300;400;500;600;700;900&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<style>
  :root{
    --bg:#05070b;
    --bg-2:#0b0f17;
    --panel:#0e131d;
    --panel-2:#121826;
    --line:#212b3b;
    --line-soft:#1a2230;
    --ink:#eef2f7;
    --ink-dim:#8b96a8;
    --ink-faint:#5b6577;
    --cyan:#49d3ff;
    --cyan-dim:#1f6f8c;
    --amber:#ff8a3d;
    --amber-dim:#7a4322;
    --shadow: 0 30px 80px -30px rgba(0,0,0,.75);
  }

  *{box-sizing:border-box; margin:0; padding:0;}

  html{scroll-behavior:smooth;}

  body{
    min-height:100vh;
    background:
      radial-gradient(1100px 620px at 18% -6%, rgba(73,211,255,.10), transparent 60%),
      radial-gradient(900px 700px at 100% 8%, rgba(255,138,61,.07), transparent 55%),
      var(--bg);
    color:var(--ink);
    font-family:'Noto Sans TC','Sora',sans-serif;
    font-weight:400;
    -webkit-font-smoothing:antialiased;
  }

  a{color:inherit; text-decoration:none;}
  img{max-width:100%; display:block; border-radius:10px;}

  /* ---------- top bar ---------- */
  .topbar{
    position:sticky; top:0; z-index:60;
    display:flex; align-items:center; justify-content:space-between;
    padding:16px 22px;
    background:linear-gradient(180deg, rgba(5,7,11,.92), rgba(5,7,11,.7));
    backdrop-filter:blur(6px);
    border-bottom:1px solid var(--line-soft);
  }
  .brand{display:flex; align-items:center; gap:10px; font-weight:700; letter-spacing:.02em;}
  .brand .dot{width:9px; height:9px; border-radius:50%; background:var(--cyan); box-shadow:0 0 12px var(--cyan);}
  .topbar a.home{font-size:14px; color:var(--ink-dim); border:1px solid var(--line); padding:8px 14px; border-radius:999px;}
  .topbar a.home:hover{color:var(--ink); border-color:var(--cyan-dim);}

  /* ---------- layout ---------- */
  .wrap{
    max-width:1180px; margin:0 auto;
    padding:28px 22px 80px;
    display:grid;
    grid-template-columns: 300px 1fr;
    gap:26px;
  }
  @media (max-width:860px){
    .wrap{grid-template-columns:1fr;}
  }

  h1.page-title{
    font-size:28px; font-weight:800; margin-bottom:4px;
  }
  .page-sub{color:var(--ink-dim); font-size:14px; margin-bottom:22px;}

  /* ---------- search ---------- */
  .search-box{
    position:relative;
    margin-bottom:18px;
  }
  .search-box input{
    width:100%;
    padding:13px 16px 13px 42px;
    border-radius:12px;
    border:1px solid var(--line);
    background:var(--panel);
    color:var(--ink);
    font-size:14px;
    font-family:inherit;
    outline:none;
    transition:border-color .15s ease, box-shadow .15s ease;
  }
  .search-box input:focus{border-color:var(--cyan-dim); box-shadow:0 0 0 3px rgba(73,211,255,.12);}
  .search-box input::placeholder{color:var(--ink-faint);}
  .search-box svg{
    position:absolute; left:14px; top:50%; transform:translateY(-50%);
    width:16px; height:16px; stroke:var(--ink-faint);
  }
  .search-meta{font-size:12px; color:var(--ink-faint); margin:-8px 2px 18px; min-height:16px;}

  /* ---------- guide list ---------- */
  .guide-list{
    display:flex; flex-direction:column; gap:8px;
    max-height:70vh; overflow-y:auto;
    padding-right:4px;
  }
  .guide-item{
    display:block;
    padding:12px 14px;
    border-radius:12px;
    border:1px solid var(--line-soft);
    background:var(--panel);
    cursor:pointer;
    transition:border-color .15s ease, background .15s ease, transform .1s ease;
  }
  .guide-item:hover{border-color:var(--cyan-dim); transform:translateX(2px);}
  .guide-item.active{border-color:var(--cyan); background:var(--panel-2);}
  .guide-item .g-title{font-size:14px; font-weight:600; margin-bottom:4px;}
  .guide-item .g-snippet{font-size:12px; color:var(--ink-dim); line-height:1.5; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;}
  .guide-item mark{background:rgba(73,211,255,.28); color:var(--ink); padding:0 1px; border-radius:3px;}
  .empty-state{color:var(--ink-faint); font-size:13px; padding:18px 4px;}

  /* ---------- content pane ---------- */
  .content-pane{
    background:var(--panel);
    border:1px solid var(--line-soft);
    border-radius:16px;
    padding:32px 36px;
    min-height:60vh;
    box-shadow:var(--shadow);
  }
  .content-pane.placeholder{
    display:flex; align-items:center; justify-content:center;
    color:var(--ink-faint); font-size:14px; text-align:center;
  }

  .md-body h1, .md-body h2, .md-body h3{
    font-weight:800; line-height:1.35; margin:1.4em 0 .6em;
    color:var(--ink);
  }
  .md-body h1{font-size:24px; border-bottom:1px solid var(--line-soft); padding-bottom:.4em;}
  .md-body h2{font-size:20px; color:var(--cyan);}
  .md-body h3{font-size:16px; color:var(--amber);}
  .md-body p{margin:.9em 0; line-height:1.85; color:#dbe2ec; font-size:14.5px;}
  .md-body ul, .md-body ol{margin:.7em 0 .9em 1.4em; color:#dbe2ec; font-size:14.5px; line-height:1.8;}
  .md-body li{margin:.25em 0;}
  .md-body a{color:var(--cyan); text-decoration:underline; text-underline-offset:2px;}
  .md-body img{margin:1.2em auto; box-shadow:var(--shadow); border:1px solid var(--line-soft);}
  .md-body code{
    background:var(--panel-2); border:1px solid var(--line-soft);
    padding:2px 6px; border-radius:6px; font-size:13px;
  }
  .md-body pre{
    background:var(--bg-2); border:1px solid var(--line-soft); border-radius:12px;
    padding:16px; overflow-x:auto; margin:1em 0;
  }
  .md-body pre code{background:none; border:none; padding:0;}
  .md-body blockquote{
    border-left:3px solid var(--cyan-dim); margin:1em 0; padding:.4em 1em;
    color:var(--ink-dim); background:var(--panel-2); border-radius:0 10px 10px 0;
  }
  .md-body table{width:100%; border-collapse:collapse; margin:1em 0; font-size:13.5px;}
  .md-body th, .md-body td{border:1px solid var(--line-soft); padding:8px 10px; text-align:left;}
  .md-body th{background:var(--panel-2); color:var(--ink);}
  .md-body hr{border:none; border-top:1px solid var(--line-soft); margin:1.6em 0;}

  .loading, .load-error{color:var(--ink-faint); font-size:13px;}
  .load-error{color:var(--amber);}

  ::-webkit-scrollbar{width:8px;}
  ::-webkit-scrollbar-thumb{background:var(--line); border-radius:8px;}
</style>
</head>
<body>

  <div class="topbar">
    <div class="brand"><span class="dot"></span>用戶指南</div>
    <a class="home" href="../">返回主頁</a>
  </div>

  <div class="wrap">
    <aside>
      <div class="search-box">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input id="searchInput" type="text" placeholder="搜尋指南（標題或內文）...">
      </div>
      <div class="search-meta" id="searchMeta"></div>
      <div class="guide-list" id="guideList">
        <div class="empty-state">載入指南中...</div>
      </div>
    </aside>

    <main>
      <h1 class="page-title">用戶指南</h1>
      <div class="page-sub">搜尋範圍涵蓋標題與全文內容</div>
      <div class="content-pane placeholder" id="contentPane">
        請從左側選擇一份指南，或使用搜尋框查詢內容
      </div>
    </main>
  </div>

<script>
(function(){
  const PUB_DIR = './pub/';
  const MANIFEST_URL = PUB_DIR + 'manifest.json';

  const guideListEl = document.getElementById('guideList');
  const contentPane = document.getElementById('contentPane');
  const searchInput = document.getElementById('searchInput');
  const searchMeta = document.getElementById('searchMeta');

  let guides = [];      // { file, title, content, plain }
  let activeFile = null;

  // ---- markdown renderer: rewrite relative image paths to live under /userguide/pub/ ----
  const renderer = new marked.Renderer();
  renderer.image = function(href, title, text){
    let src = href;
    if (typeof src === 'object' && src !== null) { // marked v12 token form
      title = src.title; text = src.text; src = src.href;
    }
    if (src && !/^([a-z]+:)?\/\//i.test(src) && !src.startsWith('/')) {
      src = PUB_DIR + src.replace(/^\.?\//, '');
    }
    const altAttr = text ? ` alt="${text}"` : '';
    const titleAttr = title ? ` title="${title}"` : '';
    return `<img src="${src}"${altAttr}${titleAttr} loading="lazy">`;
  };
  marked.setOptions({ renderer, breaks:true, gfm:true });

  function stripMd(md){
    return md
      .replace(/```[\s\S]*?```/g, ' ')
      .replace(/`[^`]*`/g, ' ')
      .replace(/!\[[^\]]*\]\([^)]*\)/g, ' ')
      .replace(/\[([^\]]*)\]\([^)]*\)/g, '$1')
      .replace(/[#>*_~\-]/g, ' ')
      .replace(/\s+/g, ' ')
      .trim();
  }

  function extractTitle(md, fallback){
    const m = md.match(/^\s*#\s+(.+)$/m);
    return m ? m[1].trim() : fallback;
  }

  async function loadManifest(){
    const res = await fetch(MANIFEST_URL, { cache:'no-store' });
    if (!res.ok) throw new Error('manifest not found');
    return res.json(); // expects: { "guides": ["file1.md", "file2.md", ...] }
  }

  async function loadGuide(file){
    const res = await fetch(PUB_DIR + file, { cache:'no-store' });
    if (!res.ok) throw new Error('failed to load ' + file);
    return res.text();
  }

  async function init(){
    let manifest;
    try {
      manifest = await loadManifest();
    } catch (e) {
      guideListEl.innerHTML = `<div class="empty-state">
        找不到 manifest.json，請確認 /userguide/pub/manifest.json 已建立並列出所有 .md 檔案。
      </div>`;
      return;
    }

    const files = manifest.guides || [];
    if (!files.length){
      guideListEl.innerHTML = `<div class="empty-state">尚未加入任何指南（manifest.json 內的 guides 陣列為空）。</div>`;
      return;
    }

    const results = await Promise.allSettled(files.map(loadGuide));
    guides = results.map((r, i) => {
      if (r.status !== 'fulfilled') return null;
      const md = r.value;
      const title = extractTitle(md, files[i].replace(/\.md$/i, ''));
      return { file: files[i], title, raw: md, plain: stripMd(md).toLowerCase() };
    }).filter(Boolean);

    if (!guides.length){
      guideListEl.innerHTML = `<div class="empty-state">指南載入失敗，請檢查 /userguide/pub/ 內的檔案路徑。</div>`;
      return;
    }

    renderList(guides, '');

    // deep-link via #filename.md
    const hash = decodeURIComponent(location.hash.replace(/^#/, ''));
    const target = guides.find(g => g.file === hash);
    selectGuide(target ? target.file : guides[0].file);
  }

  function highlight(text, query){
    if (!query) return escapeHtml(text);
    const esc = escapeHtml(text);
    const q = escapeHtml(query);
    try {
      const re = new RegExp('(' + q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'ig');
      return esc.replace(re, '<mark>$1</mark>');
    } catch(e){ return esc; }
  }

  function escapeHtml(s){
    return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  function snippetFor(g, query){
    if (!query) return g.plain.slice(0, 90) + (g.plain.length > 90 ? '…' : '');
    const idx = g.plain.indexOf(query.toLowerCase());
    if (idx === -1) return g.plain.slice(0, 90) + (g.plain.length > 90 ? '…' : '');
    const start = Math.max(0, idx - 30);
    const end = Math.min(g.plain.length, idx + query.length + 60);
    return (start > 0 ? '…' : '') + g.plain.slice(start, end) + (end < g.plain.length ? '…' : '');
  }

  function renderList(list, query){
    if (!list.length){
      guideListEl.innerHTML = `<div class="empty-state">找不到符合「${escapeHtml(query)}」的指南</div>`;
      searchMeta.textContent = '';
      return;
    }
    searchMeta.textContent = query ? `找到 ${list.length} 份符合的指南` : `共 ${list.length} 份指南`;
    guideListEl.innerHTML = list.map(g => `
      <div class="guide-item ${g.file === activeFile ? 'active' : ''}" data-file="${encodeURIComponent(g.file)}">
        <div class="g-title">${highlight(g.title, query)}</div>
        <div class="g-snippet">${highlight(snippetFor(g, query), query)}</div>
      </div>
    `).join('');

    guideListEl.querySelectorAll('.guide-item').forEach(el => {
      el.addEventListener('click', () => selectGuide(decodeURIComponent(el.dataset.file)));
    });
  }

  function selectGuide(file){
    activeFile = file;
    const g = guides.find(x => x.file === file);
    if (!g) return;
    location.hash = encodeURIComponent(file);
    contentPane.classList.remove('placeholder');
    contentPane.innerHTML = `<div class="md-body">${marked.parse(g.raw)}</div>`;
    renderList(currentFiltered(), searchInput.value.trim());
  }

  function currentFiltered(){
    const q = searchInput.value.trim().toLowerCase();
    if (!q) return guides;
    return guides.filter(g => g.title.toLowerCase().includes(q) || g.plain.includes(q));
  }

  searchInput.addEventListener('input', () => {
    const q = searchInput.value.trim();
    renderList(currentFiltered(), q);
  });

  init();
})();
</script>

</body>
</html>
