<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>應用商店 ｜ CASIO fx-50FH II</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&family=Noto+Sans+TC:wght@300;400;500;600;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#05070b;
    --bg-2:#0b0f17;
    --panel:#0e131d;
    --panel-2:#121826;
    --line:#212b3b;
    --line-soft:#1a2230;
    --ink:#eef2f7;
    --ink-dim:#8b96a8;
    --ink-faint:#5b6577;
    --cyan:#49d3ff;
    --cyan-dim:#1f6f8c;
    --amber:#ff8a3d;
    --amber-dim:#7a4322;
    --shadow: 0 30px 80px -30px rgba(0,0,0,.75);
  }

  *{box-sizing:border-box; margin:0; padding:0;}
  html{scroll-behavior:smooth;}

  body{
    min-height:100vh;
    background:
      radial-gradient(1100px 620px at 18% -6%, rgba(73,211,255,.10), transparent 60%),
      radial-gradient(900px 700px at 100% 8%, rgba(255,138,61,.07), transparent 55%),
      var(--bg);
    color:var(--ink);
    font-family:'Noto Sans TC','Sora',sans-serif;
    -webkit-font-smoothing:antialiased;
  }

  a{color:inherit; text-decoration:none;}
  img{max-width:100%; display:block;}
  button{font-family:inherit;}

  /* ---------- top bar ---------- */
  .topbar{
    position:sticky; top:0; z-index:60;
    display:flex; align-items:center; justify-content:space-between;
    padding:16px 22px;
    background:linear-gradient(180deg, rgba(5,7,11,.92), rgba(5,7,11,.7));
    backdrop-filter:blur(6px);
    border-bottom:1px solid var(--line-soft);
  }
  .brand{display:flex; align-items:center; gap:10px; font-weight:700; letter-spacing:.02em;}
  .brand .dot{width:9px; height:9px; border-radius:50%; background:var(--amber); box-shadow:0 0 12px var(--amber);}
  .topbar a.home{font-size:14px; color:var(--ink-dim); border:1px solid var(--line); padding:8px 14px; border-radius:999px;}
  .topbar a.home:hover{color:var(--ink); border-color:var(--cyan-dim);}

  .wrap{max-width:1180px; margin:0 auto; padding:28px 22px 90px;}

  h1.page-title{font-size:28px; font-weight:800; margin-bottom:4px;}
  .page-sub{color:var(--ink-dim); font-size:14px; margin-bottom:22px;}

  /* ---------- search ---------- */
  .search-box{position:relative; max-width:480px; margin-bottom:26px;}
  .search-box input{
    width:100%; padding:13px 16px 13px 42px;
    border-radius:12px; border:1px solid var(--line);
    background:var(--panel); color:var(--ink);
    font-size:14px; font-family:inherit; outline:none;
    transition:border-color .15s ease, box-shadow .15s ease;
  }
  .search-box input:focus{border-color:var(--cyan-dim); box-shadow:0 0 0 3px rgba(73,211,255,.12);}
  .search-box input::placeholder{color:var(--ink-faint);}
  .search-box svg{position:absolute; left:14px; top:50%; transform:translateY(-50%); width:16px; height:16px; stroke:var(--ink-faint);}
  .search-meta{font-size:12px; color:var(--ink-faint); margin:-16px 2px 20px;}

  /* ---------- tag filter chips ---------- */
  .tag-row{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:26px;}
  .tag-chip{
    font-size:12px; padding:6px 13px; border-radius:999px;
    border:1px solid var(--line); color:var(--ink-dim); cursor:pointer;
    background:var(--panel); transition:all .15s ease;
  }
  .tag-chip:hover{border-color:var(--cyan-dim); color:var(--ink);}
  .tag-chip.active{border-color:var(--amber); color:var(--amber); background:rgba(255,138,61,.08);}

  /* ---------- app grid ---------- */
  .app-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(220px, 1fr));
    gap:16px;
  }
  .app-card{
    background:var(--panel); border:1px solid var(--line-soft); border-radius:16px;
    padding:18px; cursor:pointer;
    display:flex; flex-direction:column; gap:12px;
    transition:border-color .15s ease, transform .12s ease, background .15s ease;
  }
  .app-card:hover{border-color:var(--cyan-dim); transform:translateY(-3px); background:var(--panel-2);}
  .app-card .icon-row{display:flex; align-items:center; gap:12px;}
  .app-icon{width:56px; height:56px; border-radius:14px; object-fit:cover; border:1px solid var(--line-soft); background:var(--panel-2); flex-shrink:0;}
  .app-name{font-size:15px; font-weight:700; line-height:1.3;}
  .app-dev{font-size:11.5px; color:var(--ink-faint); margin-top:2px;}
  .app-desc{font-size:12.5px; color:var(--ink-dim); line-height:1.6; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;}
  .app-tags{display:flex; flex-wrap:wrap; gap:6px;}
  .app-tags .tag{font-size:11px; padding:3px 9px; border-radius:999px; background:var(--panel-2); border:1px solid var(--line-soft); color:var(--ink-faint);}
  .app-card mark{background:rgba(73,211,255,.28); color:var(--ink); padding:0 1px; border-radius:3px;}

  .empty-state{color:var(--ink-faint); font-size:13px; padding:40px 4px; text-align:center;}

  /* ---------- detail view ---------- */
  .back-btn{
    display:inline-flex; align-items:center; gap:6px;
    font-size:13px; color:var(--ink-dim); border:1px solid var(--line); padding:8px 14px;
    border-radius:999px; cursor:pointer; margin-bottom:22px; background:none;
  }
  .back-btn:hover{color:var(--ink); border-color:var(--cyan-dim);}

  .detail-head{display:flex; gap:20px; align-items:flex-start; margin-bottom:22px; flex-wrap:wrap;}
  .detail-icon{width:96px; height:96px; border-radius:22px; object-fit:cover; border:1px solid var(--line-soft); box-shadow:var(--shadow); flex-shrink:0;}
  .detail-name{font-size:24px; font-weight:800; margin-bottom:6px;}
  .detail-dev{font-size:13px; color:var(--ink-dim); margin-bottom:10px;}
  .detail-tags{display:flex; flex-wrap:wrap; gap:8px;}
  .detail-tags .tag{font-size:12px; padding:5px 12px; border-radius:999px; background:var(--panel-2); border:1px solid var(--line-soft); color:var(--ink-dim);}

  .detail-desc{
    background:var(--panel); border:1px solid var(--line-soft); border-radius:16px;
    padding:24px 26px; color:#dbe2ec; font-size:14.5px; line-height:1.9;
    white-space:pre-wrap; margin-bottom:28px;
  }

  .gallery-title{font-size:15px; font-weight:700; margin-bottom:14px; color:var(--ink-dim);}
  .gallery{display:grid; grid-template-columns:repeat(auto-fill, minmax(220px, 1fr)); gap:14px;}
  .gallery img{
    width:100%; aspect-ratio:9/16; object-fit:cover; border-radius:14px;
    border:1px solid var(--line-soft); box-shadow:var(--shadow); cursor:zoom-in;
  }

  /* lightbox */
  .lightbox{
    position:fixed; inset:0; background:rgba(3,4,7,.92); z-index:100;
    display:none; align-items:center; justify-content:center; padding:30px;
    backdrop-filter:blur(4px);
  }
  .lightbox.show{display:flex;}
  .lightbox img{max-width:min(92vw, 700px); max-height:88vh; border-radius:16px; box-shadow:var(--shadow);}
  .lightbox-close{position:absolute; top:22px; right:26px; color:var(--ink); font-size:28px; cursor:pointer;}

  /* install button */
  .install-btn{
    margin-top:16px; display:inline-flex; align-items:center; gap:8px;
    padding:11px 30px; border-radius:999px; border:none; cursor:pointer;
    background:linear-gradient(135deg, var(--amber), #ffab6b); color:#1a0e05;
    font-size:15px; font-weight:700; letter-spacing:.06em;
    box-shadow:0 10px 26px -10px rgba(255,138,61,.7);
    transition:transform .12s ease, box-shadow .15s ease;
  }
  .install-btn:hover{transform:translateY(-2px); box-shadow:0 14px 30px -10px rgba(255,138,61,.85);}
  .install-btn:active{transform:translateY(0);}
  .install-btn svg{width:17px; height:17px;}

  /* install modal */
  .modal{
    position:fixed; inset:0; z-index:110; display:none;
    align-items:center; justify-content:center; padding:24px;
    background:rgba(3,4,7,.8); backdrop-filter:blur(5px);
  }
  .modal.show{display:flex;}
  .modal-card{
    position:relative; width:100%; max-width:400px; text-align:center;
    background:var(--panel); border:1px solid var(--line); border-radius:22px;
    padding:34px 28px 28px; box-shadow:var(--shadow);
    animation:modalIn .22s ease;
  }
  @keyframes modalIn{from{opacity:0; transform:translateY(12px) scale(.97);} to{opacity:1; transform:none;}}
  .modal-close{
    position:absolute; top:14px; right:16px; width:32px; height:32px;
    border:none; background:none; color:var(--ink-dim); font-size:20px; cursor:pointer; border-radius:50%;
  }
  .modal-close:hover{color:var(--ink); background:var(--panel-2);}
  .usb-illus{display:flex; align-items:center; justify-content:center; gap:14px; margin:6px auto 24px;}
  .icon-tile{
    width:84px; height:84px; border-radius:20px; display:flex; align-items:center; justify-content:center;
    background:var(--panel-2); border:1px solid var(--line); color:var(--cyan);
  }
  .icon-tile.port{color:var(--ink);}
  .icon-tile svg{width:44px; height:44px;}
  .usb-illus .arrow{width:28px; height:28px; color:var(--amber); animation:nudge 1.4s ease-in-out infinite;}
  @keyframes nudge{0%,100%{transform:translateX(-3px);} 50%{transform:translateX(4px);}}
  .modal-text{font-size:16px; font-weight:600; line-height:1.7; color:var(--ink);}
  .modal-app{font-size:12px; color:var(--ink-faint); margin-top:10px;}

  ::-webkit-scrollbar{width:8px;}
  ::-webkit-scrollbar-thumb{background:var(--line); border-radius:8px;}
</style>
</head>
<body>

  <div class="topbar">
    <div class="brand"><span class="dot"></span>應用商店</div>
    <a class="home" href="../">返回主頁</a>
  </div>

  <div class="wrap" id="app-root">
    <div class="empty-state">載入應用程式中...</div>
  </div>

  <div class="modal" id="installModal">
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="installText">
      <button class="modal-close" id="installClose" aria-label="關閉">✕</button>

      <!-- Icons: Lucide (lucide.dev, ISC license): cable / arrow-right / usb-c-port -->
      <div class="usb-illus" aria-hidden="true">
        <div class="icon-tile">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M17 19a1 1 0 0 1-1-1v-2a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2a1 1 0 0 1-1 1zm0 2v-2"/><path d="M19 14V6.5a1 1 0 0 0-7 0v11a1 1 0 0 1-7 0V10m16 11v-2M3 5V3"/><path d="M4 10a2 2 0 0 1-2-2V6a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2a2 2 0 0 1-2 2zm3-5V3"/></svg>
        </div>
        <svg class="arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
        <div class="icon-tile port">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 12h12"/><rect width="20" height="8" x="2" y="8" rx="4"/></svg>
        </div>
      </div>

      <div class="modal-text" id="installText">請連接計數機 或 在計數機上的應用商店安裝</div>
      <div class="modal-app" id="installApp"></div>
    </div>
  </div>

  <div class="lightbox" id="lightbox">
    <span class="lightbox-close" id="lightboxClose">✕</span>
    <img id="lightboxImg" src="" alt="">
  </div>

<script>
(function(){
  const MANIFEST_URL = './apps.json';

  const root = document.getElementById('app-root');
  const lightbox = document.getElementById('lightbox');
  const lightboxImg = document.getElementById('lightboxImg');
  const lightboxClose = document.getElementById('lightboxClose');

  let apps = [];
  let activeTag = '';

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  function highlight(text, query){
    const esc = escapeHtml(text);
    if (!query) return esc;
    try {
      const re = new RegExp('(' + query.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'ig');
      return esc.replace(re, '<mark>$1</mark>');
    } catch(e){ return esc; }
  }

  async function loadManifest(){
    const res = await fetch(MANIFEST_URL, { cache:'no-store' });
    if (!res.ok) throw new Error('apps.json not found');
    return res.json(); // { "apps": [ { id, name, developer, description, icon, images:[], tags:[] } ] }
  }

  function allTags(){
    const s = new Set();
    apps.forEach(a => (a.tags || []).forEach(t => s.add(t)));
    return Array.from(s);
  }

  function filteredApps(query){
    const q = query.trim().toLowerCase();
    return apps.filter(a => {
      const matchesTag = !activeTag || (a.tags || []).includes(activeTag);
      if (!matchesTag) return false;
      if (!q) return true;
      const hay = (a.name + ' ' + (a.developer || '') + ' ' + a.description + ' ' + (a.tags || []).join(' ')).toLowerCase();
      return hay.includes(q);
    });
  }

  function renderHome(query){
    query = query || '';
    const list = filteredApps(query);
    const tags = allTags();

    root.innerHTML = `
      <h1 class="page-title">應用商店</h1>
      <div class="page-sub">為 CASIO fx-50FH II 精選的應用程式</div>

      <div class="search-box">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input id="searchInput" type="text" placeholder="搜尋應用程式（名稱、描述或標籤）..." value="${escapeHtml(query)}">
      </div>
      <div class="search-meta" id="searchMeta"></div>

      ${tags.length ? `<div class="tag-row" id="tagRow">
        <div class="tag-chip ${activeTag === '' ? 'active' : ''}" data-tag="">全部</div>
        ${tags.map(t => `<div class="tag-chip ${activeTag === t ? 'active' : ''}" data-tag="${escapeHtml(t)}">${escapeHtml(t)}</div>`).join('')}
      </div>` : ''}

      <div class="app-grid" id="appGrid"></div>
    `;

    const grid = document.getElementById('appGrid');
    const meta = document.getElementById('searchMeta');
    meta.textContent = query || activeTag ? `找到 ${list.length} 個應用程式` : `共 ${apps.length} 個應用程式`;

    if (!list.length){
      grid.innerHTML = `<div class="empty-state" style="grid-column:1/-1">找不到符合條件的應用程式</div>`;
    } else {
      grid.innerHTML = list.map(a => `
        <div class="app-card" data-id="${encodeURIComponent(a.id)}">
          <div class="icon-row">
            <img class="app-icon" src="${escapeHtml(a.icon)}" alt="${escapeHtml(a.name)} icon" loading="lazy" onerror="this.style.visibility='hidden'">
            <div>
              <div class="app-name">${highlight(a.name, query)}</div>
              ${a.developer ? `<div class="app-dev">${highlight(a.developer, query)}</div>` : ''}
            </div>
          </div>
          <div class="app-desc">${highlight(a.description, query)}</div>
          ${(a.tags && a.tags.length) ? `<div class="app-tags">${a.tags.map(t => `<span class="tag">${escapeHtml(t)}</span>`).join('')}</div>` : ''}
        </div>
      `).join('');
      grid.querySelectorAll('.app-card').forEach(el => {
        el.addEventListener('click', () => {
          location.hash = '#/app/' + el.dataset.id;
        });
      });
    }

    document.getElementById('searchInput').addEventListener('input', (e) => {
      renderHome(e.target.value);
    });

    const tagRow = document.getElementById('tagRow');
    if (tagRow){
      tagRow.querySelectorAll('.tag-chip').forEach(el => {
        el.addEventListener('click', () => {
          activeTag = el.dataset.tag;
          renderHome(document.getElementById('searchInput').value);
        });
      });
    }
  }

  function renderDetail(id){
    const a = apps.find(x => x.id === id);
    if (!a){
      root.innerHTML = `<div class="empty-state">找不到此應用程式</div><button class="back-btn" id="backBtn">← 返回商店</button>`;
      document.getElementById('backBtn').addEventListener('click', () => location.hash = '#/');
      return;
    }

    root.innerHTML = `
      <button class="back-btn" id="backBtn">← 返回商店</button>
      <div class="detail-head">
        <img class="detail-icon" src="${escapeHtml(a.icon)}" alt="${escapeHtml(a.name)} icon" onerror="this.style.visibility='hidden'">
        <div>
          <div class="detail-name">${escapeHtml(a.name)}</div>
          ${a.developer ? `<div class="detail-dev">開發者：${escapeHtml(a.developer)}</div>` : ''}
          ${(a.tags && a.tags.length) ? `<div class="detail-tags">${a.tags.map(t => `<span class="tag">${escapeHtml(t)}</span>`).join('')}</div>` : ''}
          <button class="install-btn" id="installBtn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><polyline points="7 10 12 15 17 10"/><path d="M4 20h16"/></svg>
            安裝
          </button>
        </div>
      </div>
      <div class="detail-desc">${escapeHtml(a.description)}</div>
      ${(a.images && a.images.length) ? `
        <div class="gallery-title">畫面截圖</div>
        <div class="gallery" id="gallery">
          ${a.images.map(img => `<img src="${escapeHtml(img)}" alt="${escapeHtml(a.name)} 截圖" loading="lazy">`).join('')}
        </div>
      ` : ''}
    `;

    document.getElementById('backBtn').addEventListener('click', () => location.hash = '#/');

    document.getElementById('installBtn').addEventListener('click', () => {
      installApp.textContent = a.name;
      installModal.classList.add('show');
    });

    const gallery = document.getElementById('gallery');
    if (gallery){
      gallery.querySelectorAll('img').forEach(img => {
        img.addEventListener('click', () => {
          lightboxImg.src = img.src;
          lightbox.classList.add('show');
        });
      });
    }
  }

  function route(){
    installModal.classList.remove('show');
    const hash = location.hash.replace(/^#\/?/, '');
    if (hash.startsWith('app/')){
      renderDetail(decodeURIComponent(hash.slice(4)));
    } else {
      renderHome('');
    }
    window.scrollTo(0, 0);
  }

  const installModal = document.getElementById('installModal');
  const installApp = document.getElementById('installApp');
  document.getElementById('installClose').addEventListener('click', () => installModal.classList.remove('show'));
  installModal.addEventListener('click', (e) => { if (e.target === installModal) installModal.classList.remove('show'); });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') installModal.classList.remove('show'); });

  lightboxClose.addEventListener('click', () => lightbox.classList.remove('show'));
  lightbox.addEventListener('click', (e) => { if (e.target === lightbox) lightbox.classList.remove('show'); });

  window.addEventListener('hashchange', route);

  async function init(){
    try {
      const manifest = await loadManifest();
      apps = manifest.apps || [];
    } catch(e){
      root.innerHTML = `<div class="empty-state">找不到 apps.json，請確認 /store/apps.json 已建立並列出所有應用程式資料。</div>`;
      return;
    }
    if (!apps.length){
      root.innerHTML = `<div class="empty-state">尚未加入任何應用程式（apps.json 內的 apps 陣列為空）。</div>`;
      return;
    }
    route();
  }

  init();
})();
</script>

</body>
</html>
